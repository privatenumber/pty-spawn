name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop, next]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@30f0f98ae5636b2b6501e181dfb3631b9974818d # v4
        with:
          env-mapping: |
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm
            PNPM_STORE_DIR,{{ DEV_DRIVE }}/.pnpm-store

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          run_install: true

      - name: Build
        run: pnpm build

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Type check
        if: runner.os == 'Linux'
        run: pnpm type-check

      - name: Test
        if: runner.os == 'Linux'
        run: pnpm concurrently --names 'test,node20' 'pnpm test' 'pnpm --use-node-version=20.20.0 node ./tests/node20-compat.mjs'

      - name: Test
        if: runner.os != 'Linux'
        run: pnpm test
