name: Test
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop, next]

jobs:
  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Dev Drive
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@cf663fdf88945e3faaa980ec525b5bc2350fbf9d # v3
        with:
          env-mapping: |
            PNPM_HOME,{{ DEV_DRIVE }}/.pnpm
            PNPM_STORE_DIR,{{ DEV_DRIVE }}/.pnpm-store

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          run_install: true

      - name: Build
        run: pnpm build

      - name: Lint
        if: runner.os == 'Linux'
        run: pnpm lint

      - name: Type check
        if: runner.os == 'Linux'
        run: pnpm type-check

      - name: Test
        if: runner.os == 'Linux'
        run: pnpm concurrently --names 'test,node20' 'pnpm test' 'pnpm --use-node-version=20.20.0 node ./tests/node20-compat.mjs'

      - name: Test
        if: runner.os != 'Linux'
        run: pnpm test
